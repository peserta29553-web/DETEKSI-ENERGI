<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DETEKSI – Media Pembelajaran Energi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito+Sans:wght@400;600;700;800&family=Inter:wght@700;800&display=swap">
<style>
/* ===== STYLE ===== */
:root{--navy:#1B2A4A;--blue:#73C0FF;--pink:#FFF3F3;--yellow:#FFD43C;--orange:#FF7C3B;--bg:#fff;--card:#fff;--ink:#1B2A4A;--mut:#52607d;--line:#f1dede;--ok:#17803f;--bad:#c93a3a;--fd:"Sweet Halloween",Chewy,cursive;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",Poppins,system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.brand{margin:0 0 .4em;line-height:1.15}
aside{width:236px;background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-size:30px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.brand svg{width:26px;height:26px;fill:var(--yellow)}
.tag{font-size:12px;color:#b8c6e6;margin:2px 0 24px}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:6px;border:0;border-radius:14px;background:none;color:#cdd8f2;font:600 15px "Nunito Sans",sans-serif;cursor:pointer;transition:.2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--yellow);color:var(--navy)}
main{flex:1;padding:28px;max-width:1040px;margin:0 auto;min-width:0}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(16,28,53,.06);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.hero{background:linear-gradient(135deg,#1B2A4A,#1d3a73);color:#fff;border-radius:26px;padding:28px;display:grid;gap:18px;grid-template-columns:1.2fr 1fr;align-items:center;margin-bottom:16px}
.hero h1{font-size:clamp(28px,5vw,44px)}.hero p{color:#d5e0f7}
.hero .brand{font-size:44px;margin-bottom:4px}
.btn{border:0;border-radius:14px;padding:12px 20px;font:700 15px "Nunito Sans",sans-serif;cursor:pointer;transition:.2s;background:var(--yellow);color:var(--navy)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.btn.sec{background:transparent;border:2px solid var(--blue);color:var(--blue)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(93,169,255,.18);color:var(--blue);font-size:12px;font-weight:700}
.big{font:700 32px var(--fd)}
.mut{color:var(--mut)}.small{font-size:13px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:9px;transition:width .4s}
.formula{background:var(--navy);color:var(--yellow);border-radius:14px;padding:14px 18px;font:700 22px var(--fd);text-align:center;margin:12px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Nunito Sans",sans-serif;cursor:pointer}
.tabs button.on{background:var(--navy);color:var(--yellow);border-color:var(--navy)}
.know{border-left:5px solid var(--yellow);background:rgba(185,243,107,.14);padding:12px 16px;border-radius:12px;margin:12px 0}
ul.tight{padding-left:20px;margin:6px 0}ul.tight li{margin:4px 0}
label{font-weight:600;display:block;margin:10px 0 2px}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
input[type=text],select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px "Nunito Sans",sans-serif}
.res{background:rgba(93,169,255,.14);border-radius:14px;padding:12px 16px;font:700 18px var(--fd);margin-top:10px;transition:.2s}
.res.pop{transform:scale(1.02)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 16px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:16px "Nunito Sans",sans-serif;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--blue)}.opt.sel{border-color:var(--blue);background:rgba(93,169,255,.16)}
.opt.good{border-color:var(--ok);background:rgba(23,128,63,.14);animation:pop .4s}.opt.wrong{border-color:var(--bad);background:rgba(201,58,58,.12)}
@keyframes pop{50%{transform:scale(1.03)}}
.opt b{background:var(--navy);color:var(--yellow);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.fb{padding:12px 16px;border-radius:12px;margin:10px 0;font-weight:600}.fb.ok{background:rgba(23,128,63,.15);color:var(--ok)}.fb.no{background:rgba(201,58,58,.13);color:var(--bad)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.dots button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}.dots button.done{background:var(--blue);border-color:var(--blue);color:#06142e}.dots button.cur{outline:3px solid var(--yellow)}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut)}
.rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--ink)}.r1{background:#f5c542;color:#432}.r2{background:#c9d1de;color:#223}.r3{background:#d98b52;color:#321}
.me td{background:rgba(185,243,107,.18)}
.sim{width:100%;height:auto;background:linear-gradient(#dff0ff,#f2f9ff);border-radius:16px;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.cloud{animation:drift 70s linear infinite}@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(640px)}}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,10,25,.6);z-index:50;padding:16px}#modal.open{display:grid}#modal .card{max-width:400px;margin:0}
/* ===== TEMA BARU: Playful Science Learning (cerah, putih, biru-kuning-oranye) ===== */
body{background:#fff;color:var(--ink)}
h1,h2,h3,.brand,.big{font-family:var(--fd);font-weight:400;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,42px)}
aside{background:#fff;color:var(--ink);border-right:2px solid var(--pink);box-shadow:4px 0 18px rgba(115,192,255,.14)}
.brand{color:var(--ink)}.brand svg{fill:var(--yellow);stroke:var(--orange);stroke-width:1.5}
.tag{color:var(--mut)}
nav button{color:var(--mut)}nav button svg{stroke:var(--blue)}nav button:hover{background:var(--pink)}
nav button.on{background:#DCEEFF;color:var(--ink)}nav button.on svg{stroke:#1d7fd1}
.hero{background:var(--pink);color:var(--ink);border:2px solid #ffe0e0;position:relative;overflow:hidden}
.hero p,.hero h1,.hero .brand{color:var(--ink)}.hero p{color:var(--mut)}
.orn{position:absolute;pointer-events:none;animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px) rotate(8deg)}}
.card{background:#fff;border:2px solid #f6dede;box-shadow:0 4px 0 #ffe9e9,0 8px 20px rgba(115,192,255,.12)}
.card.pk{background:var(--pink)}
.btn{background:var(--blue);color:var(--navy);box-shadow:0 3px 0 #4fa3e6}.btn:hover{box-shadow:0 5px 0 #4fa3e6}
.btn.cta{background:var(--orange);color:var(--navy);box-shadow:0 3px 0 #d9561e}.btn.cta:hover{box-shadow:0 5px 0 #d9561e}
.btn.sec{background:#fff;border:2px solid var(--blue);color:var(--ink);box-shadow:none}
.btn.ghost{background:#fff;border:2px solid #f3d6d6;color:var(--ink);box-shadow:none}
.pill{background:#FFF0B8;color:#6b4e00}
.bar{background:#ffe9e9}.bar i{background:linear-gradient(90deg,var(--blue),var(--yellow))}
.formula{background:var(--yellow);color:var(--navy);font:800 22px Inter,"Nunito Sans",sans-serif;box-shadow:0 3px 0 #e6b800}
.tabs button{border:2px solid #f3d6d6}.tabs button.on{background:var(--blue);color:var(--navy);border-color:var(--blue)}
.know{border-left:5px solid var(--yellow);background:#FFF9DC}
.res{background:var(--pink);color:var(--ink)}
.opt{border:2px solid #f3d6d6}.opt:hover{border-color:var(--blue)}.opt.sel{border-color:var(--yellow);background:#FFF6D1}
.opt b{background:var(--blue);color:var(--navy)}
.dots button{border:2px solid #f3d6d6}.dots button.done{background:var(--blue);color:var(--navy);border-color:var(--blue)}.dots button.cur{outline:3px solid var(--orange)}
.rk{background:#e9eef7}.r1{background:var(--yellow);color:var(--navy)}.r2{background:var(--blue);color:var(--navy)}.r3{background:var(--orange);color:var(--navy)}
.me td{background:#FFF6D1}
.sim{background:linear-gradient(#CDE9FF,#fff)}
input[type=range]{accent-color:var(--orange)}
#modal{background:rgba(27,42,74,.45)}
@media (max-width:820px){aside{border-right:0;border-top:2px solid var(--pink);box-shadow:0 -4px 16px rgba(115,192,255,.18)}}
@media (max-width:820px){
 body{display:block;padding-bottom:78px}
 aside{position:fixed;inset:auto 0 0 0;top:auto;width:auto;height:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
 aside .brand,aside .tag{display:none}nav{display:flex;gap:2px}
 nav button{flex-direction:column;gap:2px;padding:6px 2px;margin:0;font-size:11px;justify-content:center;text-align:center}
 main{padding:16px}.hero{grid-template-columns:1fr}.hero .brand{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

{t:"Skateboard memanfaatkan prinsip energi mekanik. Energi mekanik adalah jumlah energi potensial dan energi kinetik yang dimiliki benda. Energi potensial gravitasi dipengaruhi oleh massa benda, percepatan gravitasi, dan ketinggian benda terhadap titik acuan.",q:"Hanang memiliki massa total bersama skateboard 60 kg. Ia berada di atas lintasan skateboard pada ketinggian 1 m dari permukaan tanah. Jika percepatan gravitasi 10 m/s², besar energi potensial gravitasi Hanang adalah ....",o:["60 J","100 J","300 J","600 J"],a:3,e:"Ep = m × g × h = 60 kg × 10 m/s² × 1 m = 600 J.",f:["Kamu baru mengalikan massa dan ketinggian (60 × 1). Percepatan gravitasi g = 10 m/s² juga harus dikalikan.","Perhitunganmu belum memakai semua besaran. Gunakan Ep = m × g × h dengan m = 60 kg, g = 10 m/s², dan h = 1 m.","Faktor ½ hanya ada di rumus energi kinetik. Rumus energi potensial adalah Ep = m × g × h, tanpa ½.",null]},
{img:IMG_COASTER,q:"Sebuah kereta roller coaster bergerak melewati lintasan yang memiliki titik tertinggi dan titik terendah. Ketika kereta berada di titik tertinggi lintasan, kondisi energi yang paling tepat adalah ....",o:["Energi potensial minimum dan energi kinetik maksimum.","Energi potensial maksimum dan energi kinetik minimum.","Energi potensial dan energi kinetik selalu bernilai nol.","Energi potensial berubah seluruhnya menjadi energi panas."],a:1,e:"Ep = m × g × h, sehingga di titik tertinggi (h terbesar) Ep maksimum. Kereta bergerak paling pelan di sana, jadi Ek minimum.",f:["Itu kondisi di titik terendah lintasan, bukan di titik tertinggi. Ingat: makin tinggi, makin besar Ep.",null,"Energi tidak bernilai nol. Di titik tertinggi, kereta punya Ep besar karena ketinggiannya dan masih punya sedikit Ek.","Tanpa gesekan, energi tidak berubah menjadi panas. Energi hanya berpindah antara Ep dan Ek."]},
{q:"Sebuah mobil mainan bergerak menuruni lintasan dari titik P yang lebih tinggi menuju titik Q yang lebih rendah. Selama bergerak, mobil mengalami perubahan energi potensial menjadi energi kinetik. Pernyataan yang tepat mengenai energi mobil tersebut adalah ....",o:["Energi potensial bertambah dan energi kinetik berkurang.","Energi potensial dan energi kinetik selalu bernilai nol.","Energi potensial berkurang dan energi kinetik bertambah.","Energi potensial tetap bertambah meskipun ketinggian berkurang."],a:2,e:"Saat turun, ketinggian berkurang sehingga Ep berkurang. Energi itu berubah menjadi Ek, sehingga Ek bertambah.",f:["Pernyataan ini terbalik. Saat mobil turun, Ep justru berkurang dan Ek bertambah.","Mobil berada di ketinggian dan bergerak, jadi Ep dan Ek tidak nol.",null,"Ep sebanding dengan ketinggian. Jika ketinggian berkurang, Ep ikut berkurang."]},
{t:"Di sebuah taman bermain, seorang anak bermassa 25 kg menaiki tangga perosotan hingga berada pada ketinggian vertikal 0,8 m dari permukaan tanah.",q:"Jika percepatan gravitasi 10 m/s², besar energi potensial gravitasi anak adalah ....",o:["20 J","80 J","100 J","200 J"],a:3,e:"Ep = m × g × h = 25 kg × 10 m/s² × 0,8 m = 200 J.",f:["Kamu mungkin hanya mengalikan 25 × 0,8. Jangan lupa mengalikan g = 10 m/s².","Massa anak (25 kg) belum terpakai. Hitung 25 × 10 × 0,8.","Hasilnya belum tepat. Ulangi: Ep = m × g × h = 25 × 10 × 0,8.",null]},
{img:IMG_COASTER,t:"Perhatikan kembali ilustrasi roller coaster di bawah. Abaikan gesekan antara kereta dan lintasan.",q:"Perhatikan pernyataan berikut!<br>1. Pada titik tertinggi lintasan, energi potensial gravitasi relatif besar.<br>2. Pada titik terendah lintasan, energi potensial gravitasi selalu maksimum.<br>3. Ketika kereta bergerak menuruni lintasan, energi potensial berubah menjadi energi kinetik.<br>4. Energi mekanik kereta bertambah terus-menerus meskipun tidak ada gaya gesek.<br>Pernyataan yang benar ditunjukkan oleh nomor ....",o:["1 dan 3","1 dan 2","2 dan 4","3 dan 4"],a:0,e:"Pernyataan 1 dan 3 benar. Pernyataan 2 salah karena di titik terendah Ep minimum. Pernyataan 4 salah karena tanpa gesekan energi mekanik tetap, tidak bertambah.",f:[null,"Pernyataan 2 salah. Di titik terendah, ketinggian paling kecil sehingga Ep minimum, bukan maksimum.","Pernyataan 2 dan 4 sama-sama salah. Ep maksimum ada di titik tertinggi, dan energi mekanik tanpa gesekan tetap.","Pernyataan 3 benar, tetapi pernyataan 4 salah. Tanpa gesekan, energi mekanik tidak bertambah, nilainya tetap."]},
{t:"Hanang bermain skateboard pada lintasan yang memiliki titik A dengan ketinggian 1 m dan titik B di permukaan tanah. Massa total Hanang dan skateboard 60 kg. Jika g = 10 m/s² dan gesekan diabaikan, energi potensial Hanang di titik A adalah 600 J. Ketika mencapai titik B, energi potensialnya menjadi nol terhadap permukaan tanah.",q:"Berdasarkan hukum kekekalan energi mekanik, energi kinetik Hanang di titik B adalah ....",o:["0 J","600 J","300 J","1.200 J"],a:1,e:"Energi mekanik tetap: Em di A = 600 J + 0 = 600 J. Di B, Ep = 0 sehingga Ek = 600 J.",f:["Ep memang nol di B, tetapi energinya tidak hilang. Ep di A berubah menjadi Ek di B.",null,"Energi mekanik totalnya tetap 600 J, dan Ep di B = 0, jadi seluruhnya menjadi Ek. Tidak ada yang tersisa 300 J.","Ek tidak mungkin lebih besar dari energi mekanik total (600 J). Energi tidak bertambah dari ketiadaan."]},

/* ===== PAPAN PERINGKAT BERSAMA (Firebase Realtime Database via REST) =====
   Isi BACKEND_URL dengan alamat database Anda, contoh:
   https://nama-proyek-default-rtdb.asia-southeast1.firebasedatabase.app
   Jika dikosongkan, aplikasi berjalan seperti versi lokal (data hanya di perangkat ini).

const BACKEND_URL="";
let REMOTE=[],REMOTE_OK=false;
const apiUrl=()=>BACKEND_URL.replace(/\/$/,"")+"/attempts.json";
async function syncRemote(){if(!BACKEND_URL)return;try{const r=await fetch(apiUrl());if(!r.ok)throw 0;const o=await r.json()||{};
 REMOTE=Object.entries(o).filter(([k,a])=>a&&typeof a.score==="number"&&a.score>=0&&a.score<=100&&typeof a.time==="number"&&a.name&&a.kelas)
  .map(([k,a])=>({name:String(a.name).slice(0,24),kelas:String(a.kelas).slice(0,6),score:a.score,time:a.time,date:a.date||0,id:a.id||k}));REMOTE_OK=true}catch(e){REMOTE_OK=false}}
async function pushRemote(a){if(!BACKEND_URL)return;try{await fetch(apiUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(a)})}catch(e){}}
function onNav(){render();if(location.hash==="#peringkat"&&BACKEND_URL)syncRemote().then(render)}

const Store={mem:{},
 get(k,d){try{const v=localStorage.getItem("deteksi:"+k);return v?JSON.parse(v):(k in this.mem?this.mem[k]:d)}catch(e){return k in this.mem?this.mem[k]:d}},
 set(k,v){this.mem[k]=v;try{localStorage.setItem("deteksi:"+k,JSON.stringify(v))}catch(e){}}};

const allAttempts=()=>{if(!BACKEND_URL)return localAttempts();const m={};[...localAttempts().filter(a=>!a.demo),...REMOTE].forEach(a=>{m[a.id||a.name+a.kelas+a.date]=a});return Object.values(m)};
const saveQuizResult=r=>{Store.set("attempts",[...localAttempts(),r]);pushRemote(r)};
const keyOf=a=>(a.name+"|"+a.kelas).toLowerCase();
const getHistory=u=>allAttempts().filter(a=>!a.demo&&keyOf(a)===keyOf(u));
const bestOf=list=>list.reduce((b,a)=>!b||a.score>b.score||(a.score===b.score&&a.time<b.time)?a:b,null);

 let l=Object.values(m).map(x=>({...x,score:x.best.score,time:x.best.time}));if(kelas)l=l.filter(x=>x.kelas===kelas);
 l.sort((a,b)=>b.score-a.score||a.time-b.time);let r=0;l.forEach((x,i)=>{if(i&&x.score===l[i-1].score&&x.time===l[i-1].time)x.rank=l[i-1].rank;else x.rank=i+1});return l}

/* ===== EKSPERIMEN ROLLER COASTER (Modul Energi Mekanik) =====
   Lintasan = kurva tinggi h(x) yang dicuplik jadi path; kereta bergerak menurut panjang busur s.
   Model ideal: v² = v0² + 2g(h0 − h); gesekan (opsional): dikurangi 2·μ·g·jarak. Em = Ep + Ek. */
const EX={PX:8,DX:2,G:10,gap:26,GND:232,v0:2,s:0,s0:0,h0:20,on:false,ph:"run",last:0,raf:0,rt:0,send:0,seen:{},ans:{},pts:[],L:[],sp:{}};
